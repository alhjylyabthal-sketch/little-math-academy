function introPanel(s,i){
  const question=TEASER_QUESTIONS[i]||'ما المطلوب في هذه المهارة؟ وما الخطوة الأولى التي ستجربها؟';
  return `<section class="panel"><div class="headingrow"><h2>أكتشف ثم أفهم</h2><span class="pill">تمهيد المهارة</span></div><div class="teaser"><strong>سؤال يثير التفكير</strong><p>${esc(question)}</p></div></section>`;
}
function openSkill(i){activeId=i;let s=SKILLS[i];if(!s)return;selectedGrade=s.g-1;mount(`<section class="hero"><div><div class="eyebrow">الصف ${GRADES[s.g-1]} الابتدائي • الفصل الدراسي الأول</div><h1>${esc(s.title)}</h1></div>${heroSVG()}</section>${introPanel(s,i)}<section class="panel"><h2>ملخص المهارة</h2><div class="layout"><div class="mini"><h3>ماذا أفهم؟</h3><p>${esc(s.idea)}</p></div><div class="mini cream"><h3>مثال أتعلم منه</h3><p>${esc(s.example)}</p></div></div><div style="margin-top:13px">${lessonSVG(s)}</div><h3>خطوات تساعدني على الحل</h3><div class="liststeps">${s.steps.map((step,j)=>`<div class="steptile"><span class="numcircle">${fmt(j+1)}</span>${esc(step)}</div>`).join('')}</div><div class="notice" style="margin-top:13px">في المسائل اللفظية، أفهم المطلوب وأمثل الكميات قبل اختيار العملية.</div></section><section class="panel"><div class="headingrow"><div><h2>اختبار المهارة</h2><p class="subtitle">ستة أسئلة: فهم، تطبيق، تفسير، تحليل خطأ، موقف حياتي، وتحدٍّ.</p></div><span class="pill gold">٦ أسئلة</span></div><button class="btn" onclick="startQuiz()">ابدأ الاختبار</button><button class="btn outline" style="margin-inline-start:8px" onclick="printStudent(${i})">طباعة بطاقة الطالب</button><button class="btn soft" style="margin-top:9px" onclick="printTeacher(${i})">دليل المعلمة والإجابات</button></section>`,'home','skill')}
function startQuiz(){if(activeId===null)return;qIndex=0;answers=[];hintLevel=0;choiceLocked=false;showQuestion()}
function showQuestion(){let s=SKILLS[activeId],q=s.questions[qIndex];if(!q){finishQuiz();return}choiceLocked=false;hintLevel=0;mount(`<article class="quiz"><div class="qheader"><span class="pill gold">${esc(q.type)}</span><strong>السؤال ${fmt(qIndex+1)} من ٦</strong></div><div class="progress"><div style="width:${(qIndex/6)*100}%"></div></div><div class="qtitle">${esc(q.q)}</div><div class="answers">${q.opts.map((opt,j)=>`<button class="answer" id="opt${j}" onclick="answer(${j})">${esc(opt)}</button>`).join('')}</div><div class="qfoot"><div class="toolbar"><button id="hintbtn" class="btn outline" onclick="showHint()">تلميح أول</button></div><small>اقرأ السؤال، ثم فكر قبل الاختيار.</small></div><div id="hintcontent" aria-live="polite"></div><div id="feedback" aria-live="polite"></div><div id="forward"></div></article>`,'home','quiz')}
function showHint(){let q=SKILLS[activeId].questions[qIndex];if(hintLevel>=2||choiceLocked)return;hintLevel++;let txt=hintLevel===1?'فكّر في فكرة المهارة: '+SKILLS[activeId].idea:q.hint;document.getElementById('hintcontent').innerHTML+=`<div class="hintbox"><strong>${hintLevel===1?'تلميح أول':'تلميح أقرب'}:</strong> ${esc(txt)}</div>`;document.getElementById('hintbtn').textContent=hintLevel===1?'أحتاج تلميحًا أقرب':'ظهرت التلميحات';document.getElementById('hintbtn').disabled=hintLevel===2}
function answer(i){if(choiceLocked)return;choiceLocked=true;let q=SKILLS[activeId].questions[qIndex],good=i===q.right;answers.push({good,hints:hintLevel});for(let j=0;j<3;j++){let el=document.getElementById('opt'+j);el.disabled=true;if(j===q.right)el.classList.add('correct');else if(j===i)el.classList.add('wrong')}document.getElementById('hintbtn').disabled=true;document.getElementById('feedback').innerHTML=`<div class="feedback ${good?'correct':'wrong'}"><strong>${good?'إجابة صحيحة!':'لنراجع طريقة التفكير.'}</strong><p>${esc(q.why||'ارجع إلى المثال وراجع فكرة المهارة.')}</p></div>`;document.getElementById('forward').innerHTML=`<button class="btn gold" onclick="nextQuestion()">${qIndex===5?'عرض نتيجتي':'السؤال التالي'}</button>`}
function nextQuestion(){qIndex++;showQuestion()}
function localStore(){try{return JSON.parse(localStorage.getItem('madarek-local-results-v2')||'[]')}catch{return []}}
function saveLocal(x){try{let data=localStore();data.unshift(x);localStorage.setItem('madarek-local-results-v2',JSON.stringify(data.slice(0,100)));return true}catch{return false}}
function finishQuiz(){let s=SKILLS[activeId],score=answers.filter(x=>x.good).length,hints=answers.filter(x=>x.hints>0).length,pass=score>=5;saveLocal({grade:s.g,skill:s.title,score,hints,date:new Date().toLocaleDateString('ar-SA-u-ca-gregory-nu-arab')});mount(`<section class="panel" style="text-align:center"><div class="eyebrow">انتهت التحديات الستة</div><h1>${pass?'أحسنت! واصل التقدم':'تقدم جميل، ونحتاج تدريبًا إضافيًا'}</h1><div class="score">${fmt(score)} من ٦</div><p>${pass?'أظهرت فهمًا جيدًا. أعِد شرح الإجابات التي احتجت فيها إلى تلميح.':'ارجع إلى المثال المصور، ثم حاول مرة أخرى بأسئلة المهارة.'}</p><div class="pillrow" style="justify-content:center"><span class="pill">إجابات صحيحة: ${fmt(score)}</span><span class="pill gold">أسئلة استُخدم فيها تلميح: ${fmt(hints)}</span></div><div class="toolbar" style="justify-content:center;margin-top:18px"><button class="btn" onclick="openSkill(${activeId})">العودة إلى الشرح</button><button class="btn outline" onclick="startQuiz()">إعادة الاختبار</button><button class="btn soft" onclick="goHome()">مهارات الصف</button></div><p class="note-small" style="margin-top:13px">النتيجة مؤشر مراجعة قصير، وليست حكمًا نهائيًا على إتقان المهارة.</p></section>`,'home','result')}
function goWords(){let items=VOCAB[String(selectedGrade+1)]||[];mount(`<section class="hero"><div><div class="eyebrow">لغة الرياضيات</div><h1>أفهم المسألة… ثم أحلها</h1><p>أشرح المفردة في سياقها، وأحدد المطلوب، ثم أختار العملية بحسب العلاقة بين الكميات، لا بحسب الكلمة وحدها.</p></div>${heroSVG()}</section><section class="panel"><h2>اختاري الصف</h2><div class="grades">${GRADES.map((g,i)=>`<button class="grade ${i===selectedGrade?'selected':''}" onclick="setWordsGrade(${i})">${g}<small>الابتدائي</small></button>`).join('')}</div></section><section class="panel"><h2>قاموس الصف ${GRADES[selectedGrade]}</h2><div class="wordgrid">${items.map(v=>`<article class="word"><h3>${esc(v[0])}</h3><p>${esc(v[1])}</p><div class="example">${esc(v[2])}</div></article>`).join('')}</div><div class="notice" style="margin-top:18px">تذكّر: «أكثر من» أو «في كل» لا تحدد العملية وحدها؛ اقرأ المعطيات والسؤال كاملًا.</div></section>`, 'words')}
function setWordsGrade(i){selectedGrade=i;goWords()}
function goGuide(){mount(`<section class="hero"><div><div class="eyebrow">إرشادات مبسطة</div><h1>دليل معلمة الانتظار</h1><p>كل مهارة جاهزة للشرح والتطبيق والتقويم، دون الحاجة إلى مقاطع خارجية.</p></div>${heroSVG()}</section><section class="panel"><h2>تسلسل حصة مقترحة</h2><div class="liststeps"><div class="steptile"><span class="numcircle">١</span>اعرضوا سؤال التفكير وناقشوا الأفكار</div><div class="steptile"><span class="numcircle">٢</span>ناقشوا المثال ومثلوه بأدوات بسيطة</div><div class="steptile"><span class="numcircle">٣</span>نفذوا الأسئلة الستة والتقويم</div></div><div class="notice" style="margin-top:15px">زمن مقترح: ٢٠ دقيقة. يختار المعلم مهارة سبق أن درسها الطلاب، ويمكن عرض الأسئلة جماعيًا أو طباعة البطاقة.</div><h3>عند تعثر الطالب</h3><p>اسألي عمّا فهمه من نص السؤال، ثم استخدمي التلميح الأول، ثم التلميح الأقرب. اطلبي تفسير الاختيار قبل إظهار الإجابة.</p><h3>للصفوف الأولية</h3><p>اقرئي السؤال بصوت واضح، واستخدمي المكعبات والبطاقات الملونة وخط الأعداد عند الحاجة؛ الرسومات ليست للزينة بل لتوضيح المفهوم.</p></section>`, 'guide')}
function goRecord(){let records=localStore();mount(`<section class="hero"><div><div class="eyebrow">تقويم ومتابعة</div><h1>سجل الأنشطة على هذا الجهاز</h1><p>يحفظ المتصفح نتائج الأنشطة محليًا فقط. لا توجد مشاركة تلقائية مع الإدارة، ولا تُطلب أسماء الطلاب.</p></div>${heroSVG()}</section><section class="panel"><div class="headingrow"><h2>آخر النتائج</h2><span class="pill">${fmt(records.length)} نتيجة</span></div><div class="recordlist">${records.length?records.map(r=>`<div class="record"><strong>الصف ${GRADES[r.grade-1]}</strong> — ${esc(r.skill)}<div class="muted">${esc(r.date)} • ${fmt(r.score)} من ٦ • تلميحات: ${fmt(r.hints)}</div></div>`).join(''):'<p>لم تُسجل نتائج على هذا الجهاز بعد.</p>'}</div></section>`, 'record')}
function printStudent(id){let s=SKILLS[id],q=s.questions;printDoc(`<h1>مدارك — بطاقة الطالب</h1><h2>${esc(s.title)}</h2><p>الصف ${GRADES[s.g-1]} الابتدائي — الفصل الدراسي الأول</p><p>اسم الطالب أو الطالبة: ...........................................</p>${q.map((a,i)=>`<div class="printq"><strong>${fmt(i+1)}. ${esc(a.q)}</strong><p>${a.opts.map((op,j)=>`□ ${esc(op)}`).join('　　　 ')}</p><div class="writebox"></div></div>`).join('')}`)}
function printTeacher(id){let s=SKILLS[id];printDoc(`<h1>مدارك — دليل المعلمة والإجابات</h1><h2>${esc(s.title)}</h2><p>الصف ${GRADES[s.g-1]} الابتدائي — الفصل الدراسي الأول</p><h3>فكرة المهارة</h3><p>${esc(s.idea)}</p><h3>مثال</h3><p>${esc(s.example)}</p><h3>خطوات التوضيح</h3><p>${s.steps.map((a,i)=>fmt(i+1)+' ـ '+esc(a)).join('، ')}</p><h3>الأسئلة والإجابات والتلميحات</h3>${s.questions.map((q,i)=>`<div class="printq"><strong>${fmt(i+1)} ـ ${esc(q.q)}</strong><p>الإجابة الصحيحة: ${esc(q.opts[q.right])}</p><p>التلميح: ${esc(q.hint)}</p><p>التفسير: ${esc(q.why)}</p></div>`).join('')}`)}
function printDoc(s){document.getElementById('printarea').innerHTML=s;window.print()}

const GRADE_COLORS=['#edb32f','#18a6b8','#e56ba6','#5a9cdb','#70b94f','#9268d3'];
const GRADE_ICONS=['🧩','🔢','📚','📐','🧠','🏆'];
const SKILL_ICONS=['🧩','🔢','📝','🔍','🎯','📐'];
const features=[['📖','شرح المهارات','شرح واضح ومثال'],['🧩','اختباراتي','ستة تحديات متدرجة'],['💡','أفهم المسألة','مفردات المسائل'],['🏆','إنجازاتي','سجل على الجهاز']];
function gradeTiles(){return `<div class="gradeTiles">${GRADES.map((n,i)=>`<button class="gradeTile ${i===selectedGrade?'selected':''}" style="background:${GRADE_COLORS[i]}" onclick="setGradeAndOpen(${i})"><span>${GRADE_ICONS[i]}</span><strong>الصف ${n}</strong></button>`).join('')}</div>`}
function featureTiles(){return `<div class="featureGrid">${features.map((f,i)=>`<button class="featureTile" onclick="${['goGradeSkills()','goGradeSkills()','goWords()','goRecord()'][i]}"><span class="fi">${f[0]}</span><strong>${f[1]}</strong><small>${f[2]}</small></button>`).join('')}</div>`}
function pageHeading(k,title,desc){return `<div class="pageTitle"><span class="bubble">${k}</span><h1>${title}</h1><div class="goldLine"></div><p>${desc}</p></div>`}
function mount(body,page,section=page){
 const returnTop=section==='home'?'':returnButton('top',section);
 const returnBottom=section==='home'?'':returnButton('bottom',section);
 root.innerHTML=returnTop+body+returnBottom;
 currentView=page;currentSection=section;
 document.querySelectorAll('.toplinks button').forEach(b=>b.classList.toggle('active',b.id==='b'+page));
 window.scrollTo(0,0);
}
function goBackInside(){if(currentSection==='quiz'||currentSection==='result'){openSkill(activeId);return}if(currentSection==='skill'){goGradeSkills();return}goHome()}
function returnButton(place,section){let label=section==='quiz'||section==='result'?'الرجوع إلى شرح المهارة':section==='skill'?'الرجوع إلى مهارات الصف':section==='grades'?'الرجوع إلى الرئيسية':'الرجوع إلى الرئيسية';return `<nav class="return-nav return-nav--${place}"><button type="button" class="return-button" onclick="goBackInside()"><span class="return-symbol">↩</span>${label}</button></nav>`}
function goHome(){
 activeId=null;
 const cards=[
  ['lessons','الدروس','approved-lessons.webp','goGradeSkills()'],
  ['activities','الأنشطة','approved-activities.webp','goGradeSkills()'],
  ['games','الألعاب','approved-games.webp','goGradeSkills()'],
  ['tests','الاختبارات','approved-tests.webp','goGradeSkills()'],
  ['tools','أدوات المعلمة','approved-tools.webp','goGuide()']
 ];
 const overlays=cards.map(c=>'<button type="button" class="approved-hot approved-hot--'+c[0]+'" aria-label="'+c[1]+'" title="'+c[1]+'" onclick="'+c[3]+'"></button>').join('');
 const gradeOverlays=GRADES.map((g,i)=>'<button type="button" class="approved-hot approved-hot--g'+(i+1)+'" aria-label="الصف '+g+'" title="الصف '+g+'" onclick="setGradeAndOpen('+i+')"></button>').join('');
 const cardButtons=cards.map(c=>'<button type="button" aria-label="'+c[1]+'" title="'+c[1]+'" onclick="'+c[3]+'"><img src="./'+c[2]+'" alt="'+c[1]+'" loading="lazy"></button>').join('');
 const gradeButtons=GRADES.map((g,i)=>'<button type="button" class="approved-mobile-grade '+(i===selectedGrade?'selected':'')+'" onclick="setGradeAndOpen('+i+')" aria-label="الصف '+g+'"><strong>الصف '+g+'</strong><span>'+fmt(i+1)+'</span></button>').join('');
 const desktop='<div class="approved-desktop"><img src="./approved-main.webp" width="1672" height="853" alt="واجهة مدارك المعتمدة، بشخصيتَي الطالب والطالبة وشعار المدرسة والأقسام والصفوف" loading="eager">'+overlays+gradeOverlays+'</div>';
 const mobile='<div class="approved-mobile">'+
 '<div class="approved-mast"><img class="approved-child" src="./approved-girl.webp" alt="طالبة تحمل كتبها"><img class="approved-center" src="./approved-center.webp" alt="مدارك: بعقولنا نفكّر، وبفضولنا نكتشف"><img class="approved-child" src="./approved-boy.webp" alt="طالب يحمل جهازًا تعليميًا"></div>'+
 '<p class="approved-motto">بعقولنا نفكّر، وبفضولنا نكتشف</p>'+
 '<div class="approved-mobile-features">'+cardButtons+'</div>'+
 '<section class="approved-grades-wrap"><h2>المرحلة الابتدائية</h2><div class="approved-mobile-grades">'+gradeButtons+'</div></section>'+
 '<img class="approved-mobile-wave" src="./approved-wave.webp" alt="">'+
 '</div>';
 const shortcuts='<nav class="approved-quicknav" aria-label="خدمات المعلمة"><button type="button" onclick="sfHome()">انتظار بلا شاشة</button><button type="button" onclick="goWords()">أفهم المسألة</button><button type="button" onclick="goRecord()">سجل النتائج</button></nav>';
 mount('<div class="approved-home">'+desktop+mobile+shortcuts+'</div>','home','home');
}
function setGradeAndOpen(i){selectedGrade=i;goGradeSkills()}
function setGrade(i){selectedGrade=i;goGradeSkills()}
function goGradeSkills(){activeId=null;let list=SKILLS.filter(s=>s.g===selectedGrade+1);mount(`<div class="shell">${pageHeading('⭐ الفصل الدراسي الأول','مهارات الصف '+GRADES[selectedGrade],'اختاري مهارة لعرض الملخص والمثال والاختبار')}
 <div class="panel"><div class="sectionTitle"><h2>الصفوف الابتدائية</h2><span class="infochip">${fmt(list.length)} مهارات</span></div><div class="grades">${GRADES.map((g,i)=>`<button class="grade ${i===selectedGrade?'selected':''}" onclick="setGrade(${i})">الصف ${g}</button>`).join('')}</div></div>
 <div class="panel"><div class="sectionTitle"><h2>اختر مهارتك</h2><span class="bubble">📚 الفصل الأول</span></div><div class="skillgrid">${list.map((s,k)=>`<article class="skill"><span class="eyebrow">${SKILL_ICONS[k%6]} المهارة ${fmt(k+1)}</span><h3>${esc(s.title)}</h3><p>${esc(s.idea)}</p><div class="pillrow"><span class="pill">شرح ومثال</span><span class="pill gold">٦ أسئلة</span></div><button class="btn action" onclick="openSkill(${s.index})">ابدأ المهارة ←</button></article>`).join('')}</div></div></div>`,'skills','grades')}
function openSkill(i){activeId=i;let s=SKILLS[i];if(!s)return;selectedGrade=s.g-1;const question=TEASER_QUESTIONS[i]||'ما المطلوب في هذه المهارة؟ وما الخطوة الأولى التي ستجربها؟';
